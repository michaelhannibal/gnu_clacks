name: Publish package to pub.dev
on:
  push:
    tags:
      - 'gnu_clacks_core-v*'
      - 'gnu_clacks_flutter-v*'
      - 'gnu_clacks_http-v*'
      - 'gnu_clacks_dio-v*'
      - 'gnu_clacks-v*'
permissions:
  contents: read
concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: false
jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    outputs:
      package: ${{ steps.tag.outputs.package }}
      version: ${{ steps.tag.outputs.version }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Verify tag, committed versions and changelogs
        id: tag
        run: |
          python3 - <<'PY'
          import os
          import sys
          sys.path.insert(0, 'tool')
          from release import PACKAGES, ROOT, VERSION, verify_versions
          package, version = os.environ['GITHUB_REF_NAME'].rsplit('-v', 1)
          if package not in PACKAGES or not VERSION.fullmatch(version):
              raise SystemExit('Invalid package release tag')
          verify_versions(ROOT, version)
          with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
              output.write(f'package={package}\nversion={version}\n')
          PY
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          flutter-version: '3.47.4'
          channel: stable
          cache: false
      - run: flutter pub get --enforce-lockfile
      - run: python3 -m unittest discover -s tool -p 'test_*.py'
      - run: python3 tool/sync_package_docs.py --check
      - run: dart format --output=none --set-exit-if-changed packages apps tool
      - run: dart analyze --fatal-infos
      - name: Native package and example regression tests
        run: |
          for package in core http dio; do
            (cd "packages/gnu_clacks_${package}" && dart test)
          done
          (cd packages/gnu_clacks_flutter && flutter test --no-pub)
          (cd packages/gnu_clacks && flutter test --no-pub)
          (cd apps/gnu_clacks_example && flutter test --no-pub)
  publish:
    needs: validate
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    environment: pub.dev
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      # setup-dart configures short-lived pub.dev OIDC credentials.
      - uses: dart-lang/setup-dart@2286a0c042b44434fe26d292bbce8d34f7ec662b # v1
        with:
          sdk: '3.13.3'
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          flutter-version: '3.47.4'
          channel: stable
          cache: false
      - name: Wait for dependencies, validate archive and publish
        env:
          RELEASE_PACKAGE: ${{ needs.validate.outputs.package }}
          RELEASE_VERSION: ${{ needs.validate.outputs.version }}
        run: python3 tool/release.py "$RELEASE_VERSION" --publish --ci --package "$RELEASE_PACKAGE"
