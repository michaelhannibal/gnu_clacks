name: Release inspection (never publishes)
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          flutter-version: '3.47.4'
          channel: stable
          cache: false
      - run: flutter pub get --enforce-lockfile
      - run: python3 tool/sync_package_docs.py --check
      - id: dryrun
        continue-on-error: true
        run: python3 tool/stage_release.py --report release-dry-run.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: staged-release-inspection
          retention-days: 7
          if-no-files-found: error
          path: release-dry-run.json
      - name: Preserve a failing readiness status
        if: steps.dryrun.outcome != 'success'
        run: exit 1
