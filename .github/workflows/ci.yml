name: Package and platform checks
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          flutter-version: '3.47.4'
          channel: stable
          cache: false
      - run: flutter pub get --enforce-lockfile
      - run: dart format --output=none --set-exit-if-changed packages apps tool
      - run: dart analyze --fatal-infos
      - run: python3 tool/sync_package_docs.py --check
      - run: dart run packages/gnu_clacks_core/example/gnu_clacks_core_example.dart
      - name: Flutter engine and golden tests
        run: |
          (cd packages/gnu_clacks_flutter && flutter test --no-pub)
          (cd apps/gnu_clacks_example && flutter test --no-pub)
      - name: Browser policy, CORS and UI tests
        env:
          CHROME_EXECUTABLE: /usr/bin/google-chrome
        run: |
          for package in core http dio; do
            (cd "packages/gnu_clacks_${package}" && dart test --platform chrome)
          done
          (cd packages/gnu_clacks_flutter && flutter test --no-pub --platform chrome test/web_smoke_test.dart)
          (cd apps/gnu_clacks_example && flutter test --no-pub --platform chrome test/web_test.dart)
      - name: Generate API documentation
        run: |
          for package in core flutter http dio; do
            (cd "packages/gnu_clacks_${package}" && dart doc --output "$RUNNER_TEMP/api-${package}")
          done

  native:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            target: linux
          - os: macos-15
            target: macos
          - os: windows-2025
            target: windows
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          flutter-version: '3.47.4'
          channel: stable
          cache: false
      - name: Linux build prerequisites
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev
      - run: flutter pub get --enforce-lockfile
      - name: Native policy and adapter tests
        run: |
          for package in core http dio; do
            (cd "packages/gnu_clacks_${package}" && dart test)
          done
      - name: Non-golden widget checks
        if: runner.os != 'Linux'
        run: |
          (cd packages/gnu_clacks_flutter && flutter test --no-pub test/tribute_test.dart test/signal_test.dart test/example_test.dart)
          (cd apps/gnu_clacks_example && flutter test --no-pub test/app_test.dart test/network_test.dart test/performance_test.dart)
      - name: Build desktop example
        working-directory: apps/gnu_clacks_example
        run: flutter build ${{ matrix.target }} --no-pub
      - name: Build iOS simulator without signing or deployment
        if: runner.os == 'macOS'
        working-directory: apps/gnu_clacks_example
        run: flutter build ios --simulator --debug --no-codesign --no-pub

  web-android:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    defaults:
      run:
        shell: bash
        working-directory: apps/gnu_clacks_example
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          flutter-version: '3.47.4'
          channel: stable
          cache: false
      - run: flutter pub get --enforce-lockfile
      - run: flutter build web --no-pub --no-web-resources-cdn --no-wasm-dry-run
      - run: flutter build apk --debug --no-pub
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: example-web-and-android-debug
          retention-days: 7
          if-no-files-found: error
          path: |
            apps/gnu_clacks_example/build/web
            apps/gnu_clacks_example/build/app/outputs/flutter-apk/app-debug.apk
